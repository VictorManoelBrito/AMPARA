name: CI

# Quando a esteira roda
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # permite rodar manualmente pela aba Actions (útil na demonstração)

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1: testes unitários (JUnit) do app Android
  # ------------------------------------------------------------------
  testes-unitarios:
    name: Testes unitários (JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Publicar relatório dos testes
        if: always() # publica mesmo quando algum teste falha
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/testDebugUnitTest/

  # ------------------------------------------------------------------
  # Job 2: análise estática de segurança (SAST) com Semgrep
  # ------------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar Semgrep
        # --severity ERROR: só considera achados de severidade máxima (ERROR = crítico)
        # --error: devolve código de saída 1 se houver achado -> job fica vermelho
        run: >
          semgrep scan
          --config p/java
          --config p/owasp-top-ten
          --severity ERROR
          --error
